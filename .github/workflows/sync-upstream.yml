name: Sync fork with upstream

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync with morluto/rea
        env:
          GH_TOKEN: ${{ secrets.SYNC_PAT }}
        run: gh repo sync ourvar/rea --source morluto/rea --branch main
